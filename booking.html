  <section class="section container">
    <h1>预约</h1>
    <p class="notice">请至少提前 2 天预约，提交后将跳转 WhatsApp 确认。</p>

    <form id="booking-form" class="booking-form">
      <label>姓名 <input type="text" name="name" required /></label>
      <label>电话 / WhatsApp <input type="tel" name="phone" required /></label>
      <label>预约日期 <input type="date" name="date" required /></label>
      <label>时段
        <select name="time">
          <option>14:00</option>
          <option>19:00</option>
          <option>21:00</option>
        </select>
      </label>
      <label>人数 <input type="number" name="players" min="1" required /></label>
      <label>想玩的剧本
        <select name="script" id="script-select"></select>
      </label>
      <label>备注 <textarea name="note" rows="3"></textarea></label>
      <button type="submit" class="btn btn-primary">提交并跳转 WhatsApp</button>
    </form>

    <div class="booking-placeholder">
      <p>🔒 会员系统与在线预约系统开发中，后期将支持注册登录、预约记录与店家后台确认。</p>
    </div>
  </section>

      <a class="wa-float" href="https://wa.me/60168607741" target="_blank" rel="noopener">WhatsApp 预约</a>
    </div>
